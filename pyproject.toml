[project]
name = "demandforecast"
version = "0.1.0"
description = "Prévision de la demande retail (Favorita) : baselines, ETS/SARIMA/Prophet, LightGBM, intervalles, stock de sécurité"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "lightgbm>=4.0",
  "statsmodels>=0.14", "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.3", "tabulate>=0.9",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "streamlit>=1.32", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
